<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SG Taxi Radar 🇸🇬</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #181c24; color: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }

    .top-header {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(24, 28, 36, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .header-title h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title p {
      font-size: 12px;
      color: #9aa0a6;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .badge {
      background: #238636;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .badge.loading {
      background: #8957e5;
    }

    .action-controls {
      position: absolute;
      bottom: 24px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #21262d;
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, background 0.2s;
    }
    .action-btn:active {
      transform: scale(0.92);
      background: #30363d;
    }

    .legend-bar {
      position: absolute;
      bottom: 24px;
      left: 14px;
      z-index: 1000;
      background: rgba(24, 28, 36, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #c9d1d9;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-marker {
      width: 22px;
      height: 22px;
      background: #1f6feb;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(31, 111, 235, 0.35);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(31, 111, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0); }
    }

    .taxi-marker {
      width: 32px;
      height: 32px;
      background: #f1c40f;
      border: 2px solid #2c3e50;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .taxi-marker:hover {
      transform: scale(1.18);
    }

    .stand-marker {
      width: 30px;
      height: 30px;
      background: #0969da;
      border: 2px solid #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .leaflet-popup-content-wrapper {
      background: #1f242d;
      color: #fff;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: #1f242d;
    }
    .popup-content {
      padding: 4px;
      font-size: 13px;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #58a6ff;
    }
    .popup-sub {
      color: #8b949e;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .btn-nav {
      display: block;
      width: 100%;
      text-align: center;
      background: #238636;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="header-title">
      <h1>🚕 SG Taxi Radar</h1>
      <p id="loc-name">Loading location...</p>
    </div>
    <div id="taxi-badge" class="badge">Scanning...</div>
  </div>

  <div id="map"></div>

  <div class="legend-bar">
    <div class="legend-item"><span>🔵</span> Searched Location</div>
    <div class="legend-item"><span>🚕</span> Vacant Taxi (Live)</div>
    <div class="legend-item"><span>🚖</span> Official Taxi Stand</div>
  </div>

  <div class="action-controls">
    <button class="action-btn" id="btn-refresh" title="Refresh Taxis">🔄</button>
    <button class="action-btn" id="btn-locate" title="Center My Location">🎯</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    let centerLat = parseFloat(urlParams.get('lat') || '1.3048');
    let centerLon = parseFloat(urlParams.get('lon') || '103.8318');
    let locTitle = urlParams.get('name') || 'Orchard Area';

    document.getElementById('loc-name').textContent = locTitle;

    const map = L.map('map', {
      center: [centerLat, centerLon],
      zoom: 16,
      zoomControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const userLayer = L.layerGroup().addTo(map);
    const taxiLayer = L.layerGroup().addTo(map);
    const standLayer = L.layerGroup().addTo(map);
    const rangeLayer = L.layerGroup().addTo(map);

    function updateCenterPin(lat, lon, title) {
      userLayer.clearLayers();
      rangeLayer.clearLayers();

      L.circle([lat, lon], {
        radius: 500,
        color: '#388bfd',
        fillColor: '#388bfd',
        fillOpacity: 0.08,
        weight: 1.5,
        dashArray: '4, 4'
      }).addTo(rangeLayer);

      L.circle([lat, lon], {
        radius: 1000,
        color: '#8b949e',
        fillOpacity: 0.02,
        weight: 1,
        dashArray: '2, 6'
      }).addTo(rangeLayer);

      const userIcon = L.divIcon({
        className: 'custom-div-icon',
        html: '<div class="user-marker"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      const marker = L.marker([lat, lon], { icon: userIcon }).addTo(userLayer);
      marker.bindPopup(`
        <div class="popup-content">
          <div class="popup-title">📍 ${title}</div>
          <div class="popup-sub">Radar Center Coordinates</div>
          <div style="font-size: 11px; color: #8b949e;">Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}</div>
        </div>
      `);
    }

    updateCenterPin(centerLat, centerLon, locTitle);

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function loadTaxiData(lat, lon) {
      const badge = document.getElementById('taxi-badge');
      badge.textContent = 'Updating...';
      badge.classList.add('loading');

      try {
        const apiUrl = `https://blcsjvifiytbznwesmyx.supabase.co/functions/v1/lta_bot/api/taxis?lat=${lat}&lon=${lon}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('API fetch failed');
        const data = await res.json();

        taxiLayer.clearLayers();
        standLayer.clearLayers();

        let count500m = 0;
        let count1km = 0;

        const taxis = data.taxis || [];
        taxis.forEach(t => {
          const dist = calculateDistance(lat, lon, t.Latitude, t.Longitude);
          if (dist <= 500) count500m++;
          if (dist <= 1000) count1km++;

          const taxiIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="taxi-marker">🚕</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const m = L.marker([t.Latitude, t.Longitude], { icon: taxiIcon }).addTo(taxiLayer);
          m.bindPopup(`
            <div class="popup-content">
              <div class="popup-title">🚕 Vacant Taxi</div>
              <div class="popup-sub">📍 ~${Math.round(dist)}m from center</div>
              <div style="font-size: 11px; color: #3fb950; font-weight: 600;">Available Now (LTA Live Stream)</div>
              <a href="https://www.google.com/maps/search/?api=1&query=${t.Latitude},${t.Longitude}" target="_blank" class="btn-nav">🗺️ View in Google Maps</a>
            </div>
          `);
        });

        const stands = data.stands || [];
        stands.forEach(s => {
          const dist = Math.round(calculateDistance(lat, lon, s.latitude, s.longitude));
          const standIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="stand-marker">🚖</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          });

          const m = L.marker([s.latitude, s.longitude], { icon: standIcon }).addTo(standLayer);
          const bfaBadge = (s.barrier_free || s.bfa === 'Yes') ? '♿ Barrier-Free' : 'Standard';
          const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.latitude},${s.longitude}`;
          
          m.bindPopup(`
            <div class="popup-content">
              <div class="popup-title">🚖 Taxi Stand [${s.taxi_code}]</div>
              <div style="font-weight: 600; color: #fff; margin-bottom: 2px;">${s.name}</div>
              <div class="popup-sub">📍 ~${dist}m away • ${s.road_name || 'Official Stand'} • ${bfaBadge}</div>
              <div style="font-size: 11px; color: #8b949e; margin-bottom: 6px;">Capacity: ${s.capacity || 2} taxis</div>
              <a href="${mapsUrl}" target="_blank" class="btn-nav">🚶 Walk to Stand (${dist}m)</a>
            </div>
          `);
        });

        badge.textContent = `🟢 ${count1km} near (1km) • ${taxis.length} Islandwide`;
        badge.classList.remove('loading');

      } catch (err) {
        console.error('Error fetching live taxis:', err);
        badge.textContent = '⚠️ Offline';
        badge.classList.remove('loading');
      }
    }

    loadTaxiData(centerLat, centerLon);

    document.getElementById('btn-refresh').addEventListener('click', () => {
      loadTaxiData(centerLat, centerLon);
    });

    document.getElementById('btn-locate').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            centerLat = pos.coords.latitude;
            centerLon = pos.coords.longitude;
            locTitle = "Your Current Location";
            document.getElementById('loc-name').textContent = locTitle;
            map.flyTo([centerLat, centerLon], 16, { animate: true, duration: 1.2 });
            updateCenterPin(centerLat, centerLon, locTitle);
            loadTaxiData(centerLat, centerLon);
          },
          (err) => {
            alert("Could not access your GPS location. Please check device location permissions.");
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    });
  </script>
</body>
</html>
